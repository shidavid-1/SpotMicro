; TPUP hardware test session
;
; Layout note: the source files live in the repo root, and main/ holds the
; entry point plus the component registration. Pointing src_dir at main/ makes
; main/CMakeLists.txt the ESP-IDF "main" component, which already pulls the
; root sources in by relative path.

[platformio]
default_envs = esp32-s3-devkitc-1
src_dir = main

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; ESP32-S3-WROOM-1, 8 MB flash, QIO.
board_build.flash_mode = qio
board_upload.flash_size = 8MB

; The test session reads keystrokes from stdin, so use the UART port on the
; DevKitC-1 (the one labeled UART, not USB) and leave the console on UART0.
; Selects which app_main is compiled in: defined = the control loop in the
; root main.cpp, absent = the hardware test session in main/main.cpp.
build_flags = -DTPUP_CONTROL_LOOP

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; sdkconfig.defaults in the project root is picked up automatically and
; carries the flash size, watchdog, and I2C deprecation settings.
