; TPUP firmware
;
; Layout note: main/ holds the two entry points, and the robot code and test
; harness are the ESP-IDF components under components/tpup and
; components/tpup_test. Pointing src_dir at main/ makes main/CMakeLists.txt the
; ESP-IDF "main" component; components/ is picked up automatically.
;
; TWO BUILDS, ONE TREE
; -------------------
; Both app_main definitions are always compiled; each is guarded on
; TPUP_CONTROL_LOOP so exactly one survives preprocessing (two would not
; link). The flag is the only difference between the environments below, so
; the mode is chosen at build time instead of by editing a source file:
;
;   walk  -DTPUP_CONTROL_LOOP set   -> control loop in main/walk_main.cpp
;   test  flag absent              -> hardware test session in main/test_main.cpp
;
;   pio run -e walk -t upload -t monitor    # walk the dog
;   pio run -e test -t upload -t monitor    # run the test session
;
; `pio run -t upload` with no -e uses default_envs below. Each environment
; keeps its own build directory under .pio/build/<env>, so switching back and
; forth does not force a full rebuild either way. VS Code equivalents are in
; .vscode/tasks.json (Ctrl+Shift+B).

[platformio]
default_envs = walk
src_dir = main

; Everything both environments share. Only build_flags differs.
[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf

; ESP32-S3-WROOM-1, 8 MB flash, QIO.
board_build.flash_mode = qio
board_upload.flash_size = 8MB

; The test session reads keystrokes from stdin, so use the UART port on the
; DevKitC-1 (the one labeled UART, not USB) and leave the console on UART0.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; sdkconfig.defaults in the project root is picked up automatically and
; carries the flash size, watchdog, and I2C deprecation settings. PlatformIO
; expands it into a generated sdkconfig.<env> per environment.

; Walking firmware: the gait control loop in main/walk_main.cpp.
[env:walk]
build_flags = -DTPUP_CONTROL_LOOP

; Hardware test session in main/test_main.cpp. Defines no TPUP_CONTROL_LOOP, which
; is what selects it -- there is deliberately no build_flags line here.
[env:test]
